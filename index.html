<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>教學部各項教學業務報告</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;height:100%;background:#f4f2ed;
    font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif}
  #app{border:0;width:100%;height:100%;display:block}
  #tip{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;font-size:12.5px;
    color:#8b9a9a;text-align:center;background:#f4f2ed}
  #tip a{color:#0d5c60}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#5f7071;font-size:14px;background:#f4f2ed}
</style>
</head>
<body>

<div id="load">系統載入中…</div>
<iframe id="app" allow="clipboard-write"></iframe>

<div id="tip" style="display:none">
  若畫面空白，請改用
  <a id="fallback" href="#">這個連結</a>
  直接開啟。
</div>

<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbzlr2kqRnQfenNxDwizJ-gkKkgolNhxoAo2iTNv9EQZuknJYNHHnZqDneY4IWaZq65S7Q/exec";

  // 每次載入都加上不同參數，避免瀏覽器沿用舊版畫面
  var frame = document.getElementById('app');
  frame.onload = function () { document.getElementById('load').style.display = 'none'; };
  frame.src = APP_URL + '?v=' + Date.now();
  document.getElementById('fallback').href = APP_URL;

  setTimeout(function () {
    if (document.getElementById('load').style.display !== 'none') {
      document.getElementById('tip').style.display = 'block';
    }
  }, 8000);
</script>

</body>
</html>
